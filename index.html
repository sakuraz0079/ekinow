<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えきなう</title>
<meta name="description" content="いま乗っている電車の位置と次の駅がわかる">
<meta name="apple-mobile-web-app-title" content="えきなう">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* --c-line* は路線データから JS で上書き */
  --c-line:#F26522; --c-line-soft:#FDE3D4; --c-line-dark:#FF7A3D; --c-line-dark-soft:#3A2418; --c-on-line:#FFFFFF;
  --on-line:var(--c-on-line); /* 路線色の上に載せる文字色 */
  --line:var(--c-line);
  --line-soft:var(--c-line-soft);
  --board:#FFFFFF;
  --page:#EEF0F2;
  --ink:#23272D;
  --muted:#6B7280;
  --rule:#D5D9DE;
  --ok:#1F9D55;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --line:var(--c-line-dark); --line-soft:var(--c-line-dark-soft); --board:#24272C; --page:#17191C;
    --ink:#F1F2F4; --muted:#A3A9B2; --rule:#3A3F46; --ok:#4ADE80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --line:var(--c-line-dark); --line-soft:var(--c-line-dark-soft); --board:#24272C; --page:#17191C;
  --ink:#F1F2F4; --muted:#A3A9B2; --rule:#3A3F46; --ok:#4ADE80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:520px;margin:0 auto;padding:14px 14px 32px}

.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:2px 4px 10px}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.status.live .dot{background:var(--ok)}

/* 路線選択 */
.pick{position:relative;margin:0 0 10px}
.pick select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--board);border:0;border-left:8px solid var(--line);border-radius:8px;padding:11px 40px 11px 14px;cursor:pointer}
.pick::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.pick select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* 近くの路線の提案 */
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--board);border-radius:10px;padding:10px 10px 10px 14px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.suggest[hidden]{display:none}
.suggest .t{flex:1 0 100%;display:flex;justify-content:space-between;align-items:center}
.suggest .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer}
.suggest .go{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:transparent;border:2px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer}
.suggest .go i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* 駅名標 */
.sign{background:var(--board);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--rule)}
.sign-top{padding:18px 18px 12px;text-align:center}
.lead{font-size:14px;color:var(--muted);min-height:20px}
/* --n: 文字数。長い駅名も1行に収める */
.name{--n:4;font-size:min(64px,14vw,calc((min(100vw,520px) - 72px) / (var(--n) * 1.05)));white-space:nowrap;font-weight:900;letter-spacing:.04em;line-height:1.1;margin:2px 0}
.kana{font-size:15px;color:var(--muted);letter-spacing:.12em;min-height:22px}
.band{background:var(--line);height:34px;position:relative;margin-top:12px}
.track{position:absolute;left:18px;right:18px;top:50%;height:4px;margin-top:-2px;background:rgba(255,255,255,.55);border-radius:2px}
.train{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:5px solid var(--ink);transition:left .8s ease;left:0}
.ends{display:flex;justify-content:space-between;padding:10px 16px 14px;font-size:17px;font-weight:700;gap:8px}
.ends span{max-width:48%}
.ends .r{text-align:right}
.ends small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.remain{text-align:center;font-size:14px;color:var(--muted);padding:0 16px 16px;min-height:20px}

/* 方面 */
.seg{display:flex;margin:14px 0 4px;background:var(--board);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:9px 4px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--on-line);font-weight:700}

.actions{display:flex;gap:8px;margin:12px 0}
.actions button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:13px 8px;border-radius:8px;border:2px solid var(--line);background:var(--line);color:var(--on-line);cursor:pointer}
.actions button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{font-size:13px;color:var(--muted);margin:0 4px 12px;line-height:1.6}

/* 路線図 */
.route{background:var(--board);border-radius:10px;padding:10px 0;list-style:none;margin:0}
.route li{position:relative;display:flex;align-items:center;gap:12px;padding:7px 16px 7px 44px;font-size:16px}
.route li::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:5px;background:var(--line);transform:translateX(-50%)}
.route li:first-child::before{top:50%}
.route li:last-child::before{bottom:50%}
.route li::after{content:"";position:absolute;left:24px;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--board);border:3px solid var(--line)}
.route li.past{color:var(--muted)}
.route li.past::before{background:var(--rule)}
.route li.cur{font-weight:900}
.route li.cur::after{background:var(--ink);border-color:var(--ink)}
.route li.gap{height:0;padding:0;overflow:visible}
.route li.gap::after{display:none}
.route li .me{position:absolute;left:24px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:4px solid var(--ink);top:50%;z-index:1}
.route li .tag{margin-left:auto;font-size:12px;font-weight:700}
.route li .tag:not(:empty){background:var(--line);color:var(--on-line);border-radius:999px;padding:1px 8px}
@media (prefers-reduced-motion:reduce){.train{transition:none}}
</style>
</head>
<body>
<main>
  <div class="status" id="status"><span><span class="dot"></span><span id="statusText">位置情報オフ</span></span><span id="acc"></span></div>

  <div class="pick"><select id="lineSel" aria-label="路線"></select></div>
  <div class="suggest" id="suggest" role="status" aria-live="polite" hidden></div>

  <section class="sign" aria-live="polite">
    <div class="sign-top">
      <div class="lead" id="lead">位置情報を開始してください</div>
      <div class="name" id="name"></div>
      <div class="kana" id="kana"></div>
    </div>
    <div class="band"><div class="track"><div class="train" id="train"></div></div></div>
    <div class="ends"><span id="endL"></span><span class="r" id="endR"></span></div>
    <div class="remain" id="remain"></div>
  </section>

  <div class="seg" role="group" aria-label="進行方向">
    <button data-dir="auto" aria-pressed="true">自動</button>
    <button data-dir="1" aria-pressed="false" id="dirFwd"></button>
    <button data-dir="-1" aria-pressed="false" id="dirBack"></button>
  </div>

  <div class="actions">
    <button id="startBtn">位置情報を開始</button>
    <button id="demoBtn" class="ghost">デモ走行</button>
  </div>
  <p class="msg" id="msg"></p>

  <ol class="route" id="route"></ol>
</main>

<script src="lines/index.js"></script>
<script>
// 路線データは lines/<id>.js、一覧は lines/index.js。?line=<id> > 前回選んだ路線 > 一覧の先頭 の順で表示
const STORE_KEY = "ekinow.line";
const BASE_MSG = "画面を点けたままにすると更新が続きます。地下や高架下では位置がずれることがあります。";
const NEAR_M = 180, OFF_M = 1500;
const $ = id => document.getElementById(id);
const SUGGEST_IN_M = 400, SUGGEST_OUT_M = 600, SUGGEST_MAX_ACC_M = 500;
let LINES = {}, GEOMS = {}, LINE, ST, G, dismissed = new Set();
let dirMode = "auto", autoDir = 0, lastPos = null, lastFix = null, watchId = null, demoTimer = null, wakeLock = null;

function geom(line){ // 路線の形（始発駅基準のメートル座標の折れ線）
  const s = line.stations, lat0 = s[0].lat, lng0 = s[0].lng;
  const latMid = (Math.min(...s.map(x=>x.lat))+Math.max(...s.map(x=>x.lat)))/2;
  const g = {lat0, lng0, cos: Math.cos(latMid*Math.PI/180)};
  g.P = s.map(x=>xy(x.lat,x.lng,g));
  return g;
}

function xy(lat,lng,g=G){ // 始発駅基準のメートル座標
  return [(lng-g.lng0)*111320*g.cos, (lat-g.lat0)*110540];
}

function locate(lat,lng,g=G){
  const [x,y] = xy(lat,lng,g), P = g.P;
  let best = null;
  for(let i=0;i<P.length-1;i++){
    const [ax,ay]=P[i],[bx,by]=P[i+1],dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    let t=((x-ax)*dx+(y-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const px=ax+t*dx, py=ay+t*dy, d=Math.hypot(x-px,y-py);
    if(!best||d<best.d) best={i,t,d,len:Math.sqrt(L2)};
  }
  return best;
}

function setName(name,kana){
  $("name").textContent=name; $("name").style.setProperty("--n",Math.max(4,[...name].length));
  $("kana").textContent=kana;
}

function showLineIdle(){
  setName(LINE.name,`${ST[0][1]} ― ${ST[ST.length-1][1]}`);
}

function render(loc){
  const pos = loc.i + loc.t;
  if(lastPos!==null && Math.abs(pos-lastPos)>0.02) autoDir = pos>lastPos?1:-1;
  lastPos = pos;
  const dir = dirMode==="auto" ? (autoDir||1) : +dirMode;

  const a=ST[loc.i], b=ST[loc.i+1];
  const distA = loc.t*loc.len, distB=(1-loc.t)*loc.len;
  let atIdx = -1;
  if(distA<NEAR_M) atIdx=loc.i; else if(distB<NEAR_M) atIdx=loc.i+1;

  const offRoute = loc.d > OFF_M;
  if(offRoute){
    $("lead").textContent="路線から離れています";
    showLineIdle();
    $("remain").textContent=`最寄りの区間まで約${(loc.d/1000).toFixed(1)}km`;
  } else if(atIdx>=0){
    $("lead").textContent="ただいま";
    setName(ST[atIdx][0],ST[atIdx][1]);
    const nx = ST[atIdx+dir];
    $("remain").textContent = nx ? `次は ${nx[0]}` : "終点の区間です";
  } else {
    const nxt = dir>0 ? b : a, dist = dir>0 ? distB : distA;
    $("lead").textContent="次は";
    setName(nxt[0],nxt[1]);
    $("remain").textContent = `あと約${dist>=1000?(dist/1000).toFixed(1)+"km":Math.round(dist/10)*10+"m"}`;
  }

  // 両端の駅（進行方向が右へ流れるように）
  const L = dir>0 ? a : b, R = dir>0 ? b : a, tt = dir>0 ? loc.t : 1-loc.t;
  $("endL").innerHTML = `${L[0]}<small>${dir>0?"前の駅":"前の駅"}</small>`;
  $("endR").innerHTML = `${R[0]}<small>${atIdx>=0?"":"次の駅"}</small>`;
  $("train").style.left = (tt*100)+"%";

  // 路線図
  const items = $("route").children;
  for(let k=0;k<ST.length;k++){
    const li = items[k*2];
    li.className = "";
    const passed = dir>0 ? k<=loc.i && !(atIdx===k) : k>=loc.i+1 && !(atIdx===k);
    if(!offRoute && passed) li.classList.add("past");
    if(!offRoute && atIdx===k) li.classList.add("cur");
    li.querySelector(".tag").textContent = (!offRoute && atIdx<0 && ST[k]===(dir>0?b:a)) ? "次" : "";
  }
  document.querySelectorAll(".route .me").forEach(e=>e.remove());
  if(!offRoute && atIdx<0){
    const gap = items[loc.i*2+1], me=document.createElement("span");
    me.className="me"; gap.appendChild(me);
    // 隣の駅の行間に配置
    const h = items[loc.i*2].offsetHeight;
    me.style.top = (-h/2 + loc.t*h) + "px";
  }
}

function buildRoute(){
  const ol=$("route");
  ST.forEach((s,k)=>{
    const li=document.createElement("li");
    li.innerHTML=`<span>${s[0]}</span><span class="tag"></span>`;
    ol.appendChild(li);
    if(k<ST.length-1){const g=document.createElement("li");g.className="gap";g.setAttribute("aria-hidden","true");ol.appendChild(g);}
  });
}

// 今の路線から離れていて、別の路線の上にいそうなら切り替えを提案
function suggestLines(lat,lng,acc){
  const box = $("suggest"), curD = locate(lat,lng).d;
  if(acc > SUGGEST_MAX_ACC_M) return;
  if(curD < SUGGEST_IN_M){ box.hidden = true; return; }
  const near = Object.keys(LINES)
    .filter(id => id!==LINE.id && !dismissed.has(id))
    .map(id => ({id, d: locate(lat,lng,GEOMS[id]).d}))
    .filter(c => c.d < SUGGEST_IN_M)
    .sort((a,b) => a.d-b.d);
  if(!near.length || (box.hidden && curD < SUGGEST_OUT_M)){ if(!near.length) box.hidden = true; return; }
  const key = near.map(c=>c.id).join();
  box.hidden = false;
  if(box.dataset.key === key) return;
  box.dataset.key = key;
  box.replaceChildren();
  const t = document.createElement("div"); t.className = "t";
  t.innerHTML = `<span>この近くを走っている路線</span><button class="x" aria-label="閉じる">×</button>`;
  t.querySelector(".x").onclick = () => { near.forEach(c=>dismissed.add(c.id)); box.hidden = true; box.dataset.key = ""; };
  box.appendChild(t);
  near.forEach(c=>{
    const b = document.createElement("button"), line = LINES[c.id];
    b.className = "go"; b.style.setProperty("--c", line.color.light);
    b.innerHTML = `<i></i>${line.name}に切り替え`;
    b.onclick = () => selectLine(c.id);
    box.appendChild(b);
  });
}

function setStatus(live,text,acc){
  $("status").classList.toggle("live",live);
  $("statusText").textContent=text;
  $("acc").textContent=acc||"";
}

async function keepAwake(){
  try{ if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && (watchId!==null||demoTimer)) keepAwake(); });

function stopAll(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(demoTimer){clearInterval(demoTimer);demoTimer=null;}
  try{wakeLock&&wakeLock.release();}catch(e){}
  wakeLock=null;
  $("startBtn").textContent="位置情報を開始"; $("demoBtn").textContent="デモ走行";
  setStatus(false,"停止中");
}

$("startBtn").onclick=()=>{
  if(!LINE) return;
  if(watchId!==null){stopAll();return;}
  stopAll();
  if(!("geolocation" in navigator)){ $("msg").textContent="この画面では位置情報が使えません。Safariで直接開いてください。"; return; }
  setStatus(false,"位置を取得中…");
  keepAwake();
  watchId = navigator.geolocation.watchPosition(p=>{
    setStatus(true,"現在地を表示中",`精度 ±${Math.round(p.coords.accuracy)}m`);
    lastFix = [p.coords.latitude,p.coords.longitude];
    render(locate(...lastFix));
    suggestLines(lastFix[0],lastFix[1],p.coords.accuracy);
  },err=>{
    const m = err.code===1 ? "位置情報が許可されていません。この画面で許可できない場合は、Safariで直接開いてください。" : "位置を取得できませんでした。電波の良い場所で再度お試しください。";
    $("msg").textContent=m; setStatus(false,"取得できません");
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  $("startBtn").textContent="停止";
};

$("demoBtn").onclick=()=>{
  if(!LINE) return;
  if(demoTimer){stopAll();return;}
  stopAll(); lastPos=null; autoDir=0;
  let s=0; const dir = dirMode==="-1"?-1:1, total=(ST.length-1)*1000;
  setStatus(true,"デモ走行中");
  keepAwake();
  demoTimer=setInterval(()=>{
    s+=12; if(s>total) s=0;
    const f=s/1000, raw = dir>0?f:(ST.length-1)-f;
    const i=Math.min(ST.length-2,Math.floor(raw)), t=raw-i;
    const lat=ST[i][2]+(ST[i+1][2]-ST[i][2])*t, lng=ST[i][3]+(ST[i+1][3]-ST[i][3])*t;
    render(locate(lat,lng));
  },100);
  $("demoBtn").textContent="デモ停止";
};

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  dirMode=b.dataset.dir;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
});

function initLine(line){
  if(demoTimer) stopAll();
  LINE = line; lastPos = null; autoDir = 0;
  ST = line.stations.map(s=>[s.name,s.kana,s.lat,s.lng]);
  G = GEOMS[line.id] || geom(line);
  dismissed.clear(); $("suggest").hidden = true;

  const root = document.documentElement.style, c = line.color||{};
  const vars = {"--c-line":c.light, "--c-line-soft":c.lightSoft, "--c-line-dark":c.dark, "--c-line-dark-soft":c.darkSoft, "--c-on-line":c.onLine};
  for(const [k,v] of Object.entries(vars)) v ? root.setProperty(k,v) : root.removeProperty(k);

  document.title = `えきなう｜${line.name}`;
  showLineIdle();
  $("endL").textContent = ST[0][0];
  $("endR").textContent = ST[ST.length-1][0];
  $("dirFwd").textContent = `${ST[ST.length-1][0]}方面`;
  $("dirBack").textContent = `${ST[0][0]}方面`;
  $("msg").textContent = line.note ? `${line.note}${BASE_MSG}` : BASE_MSG;
  $("route").replaceChildren();
  buildRoute();
  $("lineSel").value = line.id;
  if(watchId!==null && lastFix) render(locate(...lastFix));
  else if(watchId===null) $("lead").textContent="位置情報を開始してください";
}

function loadScript(src){
  return new Promise((ok,ng)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = ng;
    document.head.appendChild(s);
  });
}

(async function loadLines(){
  const ids = (window.EKINOW_LINE_IDS||[]).filter(id=>/^[a-z0-9-]+$/.test(id));
  await Promise.allSettled(ids.map(id=>loadScript(`lines/${id}.js`)));
  const all = window.EKINOW_LINES||{}, ok = ids.filter(id=>all[id]);
  if(!ok.length){ $("lead").textContent="路線データを読み込めませんでした"; return; }
  ok.forEach(id=>{ LINES[id] = all[id]; GEOMS[id] = geom(all[id]); });

  const sel = $("lineSel");
  ok.forEach(id=>sel.add(new Option(LINES[id].name,id)));
  sel.onchange = ()=>selectLine(sel.value);

  let saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
  const want = new URLSearchParams(location.search).get("line");
  initLine(LINES[[want,saved].find(id=>id && LINES[id]) || ok[0]]);
})();

function selectLine(id){
  initLine(LINES[id]);
  try{ localStorage.setItem(STORE_KEY,id); }catch(e){}
  history.replaceState(null,"",`?line=${id}`);
}
</script>
</body>
</html>
