<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えきなう</title>
<meta name="description" content="いま乗っている電車の位置と次の駅がわかる">
<meta name="apple-mobile-web-app-title" content="えきなう">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* --c-line* は路線データから JS で上書き */
  --c-line:#F26522; --c-line-soft:#FDE3D4; --c-line-dark:#FF7A3D; --c-line-dark-soft:#3A2418; --c-on-line:#FFFFFF;
  --on-line:var(--c-on-line); /* 路線色の上に載せる文字色 */
  --line:var(--c-line);
  --line-soft:var(--c-line-soft);
  --board:#FFFFFF;
  --page:#EEF0F2;
  --ink:#23272D;
  --muted:#6B7280;
  --rule:#D5D9DE;
  --ok:#1F9D55;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --line:var(--c-line-dark); --line-soft:var(--c-line-dark-soft); --board:#24272C; --page:#17191C;
    --ink:#F1F2F4; --muted:#A3A9B2; --rule:#3A3F46; --ok:#4ADE80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --line:var(--c-line-dark); --line-soft:var(--c-line-dark-soft); --board:#24272C; --page:#17191C;
  --ink:#F1F2F4; --muted:#A3A9B2; --rule:#3A3F46; --ok:#4ADE80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:520px;margin:0 auto;padding:14px 14px 32px}

.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:2px 4px 10px}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.status.live .dot{background:var(--ok)}
.status.est .dot{background:#F59E0B}
.sign.est .lead::after{content:"（推定）";color:#B45309;font-weight:700}
.route li[data-k]{cursor:pointer}
.route li[data-k]:active{background:var(--line-soft)}

/* 路線選択 */
.pick{position:relative;margin:0 0 10px}
.pick select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--board);border:0;border-left:8px solid var(--line);border-radius:8px;padding:11px 40px 11px 14px;cursor:pointer}
.pick::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.pick select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* 近くの路線の提案 */
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--board);border-radius:10px;padding:10px 10px 10px 14px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.suggest[hidden]{display:none}
.suggest .t{flex:1 0 100%;display:flex;justify-content:space-between;align-items:center}
.suggest .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer}
.suggest .go{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:transparent;border:2px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer}
.suggest .go i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* 駅名標 */
.sign{background:var(--board);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--rule)}
.sign-top{padding:18px 18px 12px;text-align:center}
.lead{font-size:14px;color:var(--muted);min-height:20px}
/* --n: 文字数。長い駅名も1行に収める */
.name{--n:4;font-size:min(64px,14vw,calc((min(100vw,520px) - 72px) / (var(--n) * 1.05)));white-space:nowrap;font-weight:900;letter-spacing:.04em;line-height:1.1;margin:2px 0}
.kana{font-size:15px;color:var(--muted);letter-spacing:.12em;min-height:22px}
/* 車窓（空・雲・遠景・近景は JS で時間帯ごとに描き、速さに合わせて流す） */
.scene{position:relative;height:104px;margin-top:12px;overflow:hidden;background:linear-gradient(var(--sky1,#7EC8F2),var(--sky2,#CDEBFA))}
.scene .layer{position:absolute;left:0;right:0;background-repeat:repeat-x}
.scene .stars{top:0;height:60px;display:none}
.scene[data-tod="night"] .stars{display:block}
.scene .clouds{top:6px;height:36px}
.scene .far{bottom:22px;height:60px}
.scene .bridge{bottom:22px;height:46px;display:none}
.scene[data-theme="river"] .bridge{display:block}
.scene[data-theme="tunnel"] .clouds,.scene[data-theme="tunnel"] .stars{display:none}
.scene .near{bottom:22px;height:44px}
.scene .rail{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--line)}
.scene .rail::before{content:"";position:absolute;left:0;right:0;top:3px;height:3px;background:rgba(255,255,255,.75)}
.scene .track{position:absolute;left:26px;right:26px;bottom:22px;height:0}
.scene .plat{position:absolute;bottom:0;width:48px;height:9px;margin-left:-24px;background:#D9DDE2;border-top:3px solid #F5C400;border-radius:2px 2px 0 0}
.scene .plat.l{left:0}.scene .plat.r{left:100%}

/* キャラ電車 */
.train{position:absolute;bottom:3px;width:46px;height:46px;margin-left:-23px;left:0;transition:left .8s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.train svg{display:block;width:100%;height:100%;overflow:visible}
.train .bd{transform-box:fill-box;transform-origin:50% 100%}
.train .wh{transform-box:fill-box;transform-origin:center}
.train .ey{transform-box:fill-box;transform-origin:center}
.train .cl{display:none}
.train.run .bd{animation:bob .3s ease-in-out infinite alternate}
.train.run .wh{animation:spin var(--spin,1s) linear infinite}
.train.stop .ey{animation:blink 3.6s infinite}
.train.sleep .ey{display:none}
.train.sleep .cl{display:inline}
.train.hop svg{animation:hop .9s ease-out}
.train .zzz{position:absolute;left:70%;bottom:85%;font-size:11px;font-weight:900;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.4);opacity:0;pointer-events:none}
.train.sleep .zzz{animation:zzz 2.6s ease-in-out infinite}
.train .bubble{position:absolute;bottom:105%;left:0;white-space:nowrap;background:#fff;color:#23272D;font-size:11px;font-weight:900;padding:3px 8px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none}
.train .bubble.show{opacity:1}
@keyframes bob{to{transform:translateY(-1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}55%{transform:translateY(0)}75%{transform:translateY(-5px)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.ends{display:flex;justify-content:space-between;padding:10px 16px 14px;font-size:17px;font-weight:700;gap:8px}
.ends span{max-width:48%}
.ends .r{text-align:right}
.ends small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.remain{text-align:center;font-size:14px;color:var(--muted);padding:0 16px 16px;min-height:20px}
.remain b{font-size:20px;color:var(--ink);margin:0 2px}
.xfer{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:12px;color:var(--muted);padding:0 16px 14px;margin-top:-8px}
.xfer:empty{display:none}
.xf{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.xf i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* 方面 */
.seg{display:flex;margin:14px 0 4px;background:var(--board);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:9px 4px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--on-line);font-weight:700}

.actions{display:flex;gap:8px;margin:12px 0}
.actions button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:13px 8px;border-radius:8px;border:2px solid var(--line);background:var(--line);color:var(--on-line);cursor:pointer}
.actions button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 4px 10px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--line);margin:0}
.msg{font-size:13px;color:var(--muted);margin:0 4px 12px;line-height:1.6}

/* 路線図 */
.route{background:var(--board);border-radius:10px;padding:10px 0;list-style:none;margin:0}
.route li{position:relative;display:flex;align-items:center;gap:12px;padding:7px 16px 7px 44px;font-size:16px}
.route li::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:5px;background:var(--line);transform:translateX(-50%)}
.route li:first-child::before{top:50%}
.route li:last-child::before{bottom:50%}
.route li::after{content:"";position:absolute;left:24px;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--board);border:3px solid var(--line)}
.route li.past{color:var(--muted)}
.route li.past::before{background:var(--rule)}
.route li.cur{font-weight:900}
.route li.cur::after{background:var(--ink);border-color:var(--ink)}
.route li.gap{height:0;padding:0;overflow:visible}
.route li.gap::after{display:none}
.route li .me{position:absolute;left:24px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:4px solid var(--ink);top:50%;z-index:1}
.route li.pass{font-size:13px;color:var(--muted);padding-top:3px;padding-bottom:3px}
.route li.pass::after{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-width:0;background:var(--rule)}
.route li .pv{font-size:11px;border:1px solid var(--rule);border-radius:4px;padding:0 4px}
.route li .xfs{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;color:var(--muted)}
.route li .tag{margin-left:auto;font-size:12px;font-weight:700}
.route li .tag:not(:empty){background:var(--line);color:var(--on-line);border-radius:999px;padding:1px 8px}
@media (prefers-reduced-motion:reduce){.train{transition:none}.train *,.train svg{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="status" id="status"><span><span class="dot"></span><span id="statusText">位置情報オフ</span></span><span id="acc"></span></div>

  <div class="pick"><select id="lineSel" aria-label="路線"></select></div>
  <div class="suggest" id="suggest" role="status" aria-live="polite" hidden></div>
  <div class="suggest" id="autoNote" role="status" aria-live="polite" hidden></div>

  <section class="sign" id="sign" aria-live="polite">
    <div class="sign-top">
      <div class="lead" id="lead">位置情報を開始してください</div>
      <div class="name" id="name"></div>
      <div class="kana" id="kana"></div>
    </div>
    <div class="scene" id="scene" aria-hidden="true">
      <div class="layer stars" id="lyStars"></div>
      <div class="layer clouds" id="lyClouds"></div>
      <div class="layer far" id="lyFar"></div>
      <div class="layer near" id="lyNear"></div>
      <div class="layer bridge" id="lyBridge"></div>
      <div class="rail"></div>
      <div class="track">
        <div class="plat l"></div><div class="plat r"></div>
        <div class="train sleep" id="train">
          <svg viewBox="0 0 64 64">
            <g class="bd">
              <rect x="9" y="6" width="46" height="46" rx="13" style="fill:var(--line)"/>
              <rect x="9" y="41" width="46" height="4" fill="rgba(0,0,0,.15)"/>
              <rect x="15" y="12" width="34" height="17" rx="7" fill="#D6F1FF"/>
              <g class="ey"><circle cx="26" cy="20.5" r="3.2" fill="#3B2418"/><circle cx="38" cy="20.5" r="3.2" fill="#3B2418"/><circle cx="27" cy="19.4" r="1" fill="#fff"/><circle cx="39" cy="19.4" r="1" fill="#fff"/></g>
              <path class="cl" d="M23 21q3 2.4 6 0M35 21q3 2.4 6 0" stroke="#3B2418" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              <ellipse cx="18" cy="34" rx="3.6" ry="2.3" fill="#FFB3BE"/><ellipse cx="46" cy="34" rx="3.6" ry="2.3" fill="#FFB3BE"/>
              <path d="M28 33q4 4 8 0" stroke="#3B2418" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>
            <g class="wh"><circle cx="21" cy="56" r="6.5" fill="#5A3B2E"/><path d="M21 50.5v11M15.5 56h11" stroke="#C9A98F" stroke-width="1.6"/></g>
            <g class="wh"><circle cx="43" cy="56" r="6.5" fill="#5A3B2E"/><path d="M43 50.5v11M37.5 56h11" stroke="#C9A98F" stroke-width="1.6"/></g>
          </svg>
          <span class="zzz">z z</span>
          <span class="bubble" id="bubble"></span>
        </div>
      </div>
    </div>
    <div class="ends"><span id="endL"></span><span class="r" id="endR"></span></div>
    <div class="remain" id="remain"></div>
    <div class="xfer" id="xfer"></div>
  </section>

  <div class="seg" role="group" aria-label="進行方向">
    <button data-dir="auto" aria-pressed="true">自動</button>
    <button data-dir="1" aria-pressed="false" id="dirFwd"></button>
    <button data-dir="-1" aria-pressed="false" id="dirBack"></button>
  </div>

  <div class="actions">
    <button id="startBtn">位置情報を開始</button>
    <button id="demoBtn" class="ghost">デモ走行</button>
  </div>
  <label class="opt"><input type="checkbox" id="autoSw">近くの路線に自動で切り替える</label>
  <p class="msg" id="msg"></p>

  <ol class="route" id="route"></ol>
</main>

<script src="lines/index.js"></script>
<script>
// 路線データは lines/<id>.js、一覧は lines/index.js。?line=<id> > 前回選んだ路線 > 一覧の先頭 の順で表示
const STORE_KEY = "ekinow.line";
const BASE_MSG = "画面を点けたままにすると更新が続きます。地下や高架下では位置がずれることがあります。";
const NEAR_M = 180, OFF_M = 1500;
const $ = id => document.getElementById(id);
const SUGGEST_IN_M = 400, SUGGEST_OUT_M = 600, SUGGEST_MAX_ACC_M = 500;
const SPEED_WINDOW_MS = 15000, SPEED_MIN_SPAN_MS = 4000, MOVING_MPS = 3, MAX_MPS = 160/3.6, DEMO_MPS = 60/3.6;
const AUTO_KEY = "ekinow.autoSwitch", AUTO_FIXES = 3, AUTO_NOTE_MS = 30000;
let LINES = {}, GEOMS = {}, LINE, ST, STOP, G, LOOP = false, XFER = [], dismissed = new Set();
let autoSwitch = false, autoCand = null, autoN = 0, autoNoteTimer = null, noAuto = new Set(); // noAuto: 元に戻した路線（提案はするが自動では切り替えない）
let track = []; // 直近の {t: ミリ秒, s: 線路沿いの位置(m)}。速さの計算用
const DIR_MIN_SPAN_MS = 8000, DIR_MIN_MOVE_M = 120; // 進行方向はこれだけ進んだら決める（GPSの揺れでは届かない距離）
const BAND_BACK_M = 150; // 帯の丸印はこれ未満の後戻り（GPSの揺れ）では左へ戻さない
let band = {key:null, t:0};
// 位置の精度による扱い: GOOD 以内はそのまま、FAIR 以内は推定の合わせ直しだけ、それより悪いものは使わない
const GOOD_ACC_M = 100, FAIR_ACC_M = 500, RESYNC_M = 300;
// 推定: 正確な位置が EST_START_MS 来なければ、駅間を平均の速さで進み駅で EST_DWELL_MS 止まるとして進める
const EST_START_MS = 15000, EST_DWELL_MS = 30000, EST_MAX_MS = 20*60000, EST_DEFAULT_KMH = 45;
let est = {active:false}, lastGood = null, lastRender = null, poorSeen = false, estTimer = null;
let dirMode = "auto", autoDir = 0, lastFix = null, watchId = null, demoTimer = null, wakeLock = null;

function geom(line){ // 路線の形（始発駅基準のメートル座標の折れ線）
  const s = line.stations, lat0 = s[0].lat, lng0 = s[0].lng;
  const latMid = (Math.min(...s.map(x=>x.lat))+Math.max(...s.map(x=>x.lat)))/2;
  const g = {lat0, lng0, cos: Math.cos(latMid*Math.PI/180)};
  g.P = s.map(x=>xy(x.lat,x.lng,g));
  g.cum = [0]; // 始発駅からの距離（駅間は直線で近似）
  for(let i=1;i<g.P.length;i++) g.cum.push(g.cum[i-1]+Math.hypot(g.P[i][0]-g.P[i-1][0],g.P[i][1]-g.P[i-1][1]));
  return g;
}

function xy(lat,lng,g=G){ // 始発駅基準のメートル座標
  return [(lng-g.lng0)*111320*g.cos, (lat-g.lat0)*110540];
}

function locate(lat,lng,g=G){
  const [x,y] = xy(lat,lng,g), P = g.P;
  let best = null;
  for(let i=0;i<P.length-1;i++){
    const [ax,ay]=P[i],[bx,by]=P[i+1],dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    let t=((x-ax)*dx+(y-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const px=ax+t*dx, py=ay+t*dy, d=Math.hypot(x-px,y-py);
    if(!best||d<best.d) best={i,t,d,len:Math.sqrt(L2)};
  }
  return best;
}

function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(1)+"km" : Math.round(m/10)*10+"m"; }
function fmtTime(sec){ return sec<60 ? "1分以内" : `約${Math.round(sec/60)}分`; }
// 「約1.2km・約2分」。進行方向に走っていなければ距離だけ
function fmtAhead(m,v){ return `約<b>${fmtDist(m)}</b>` + (v>=MOVING_MPS ? `・<b>${fmtTime(m/v)}</b>` : ""); }

// 線路沿いの位置の変化から速さ(m/秒、始発駅→終点向きが正)を求める
function speedAt(s,now){
  track.push({t:now,s});
  while(track.length && now-track[0].t > SPEED_WINDOW_MS) track.shift();
  const span = now-track[0].t;
  if(span<SPEED_MIN_SPAN_MS) return null;
  const v = ds(track[0].s,s)/(span/1000);
  return Math.abs(v)<=MAX_MPS ? v : null; // GPS の飛びによる異常な速さは捨てる
}

// 環状線は先頭と末尾に同じ駅を置く。駅番号と線路沿いの位置は一周で折り返して扱う
function wrap(k){ const m = ST.length-1; return LOOP ? ((k%m)+m)%m : k; }
function ds(a,b){ // 位置 a から b への差（環状線は近い向き）
  if(!LOOP) return b-a;
  const T = G.cum[ST.length-1]; let d = (b-a)%T;
  return d>T/2 ? d-T : d<-T/2 ? d+T : d;
}
function ahead(from,to,dir){ // 位置 from から dir 向きに to まで進む距離
  if(!LOOP) return (to-from)*dir;
  const T = G.cum[ST.length-1];
  return (((to-from)*dir)%T+T)%T;
}
function sameSt(k,idx){ return k===idx || (LOOP && idx>=0 && wrap(k)===wrap(idx)); }

// k から dir 向きに見て最初に止まる駅（通過駅を飛ばす）。なければ -1
function stopFrom(k,dir){
  if(LOOP){
    for(let n=0;n<ST.length;n++,k+=dir) if(STOP[wrap(k)]) return wrap(k);
    return -1;
  }
  while(k>=0 && k<ST.length && !STOP[k]) k+=dir;
  return k>=0 && k<ST.length ? k : -1;
}

function xferChips(lines){
  return lines.map(l=>`<span class="xf" style="--c:${l.color.light}"><i></i>${l.name}</span>`).join("");
}

function setName(name,kana){
  $("name").textContent=name; $("name").style.setProperty("--n",Math.max(4,[...name].length));
  $("kana").textContent=kana;
}

function showLineIdle(){
  setName(LINE.name, LINE.kana || `${ST[0][1]} ― ${ST[ST.length-1][1]}`);
}

function render(loc,now=Date.now()){
  const offRoute = loc.d > OFF_M;
  const along = G.cum[loc.i] + loc.t*loc.len;
  if(offRoute) track = [];
  // 進行方向（自動）は直近15秒の線路沿いの速さで決める。停車中やGPSの揺れでは変えない
  const raw = offRoute ? null : speedAt(along,now);
  const moved = track.length ? ds(track[0].s,along) : 0, span = track.length ? now-track[0].t : 0;
  if(raw!==null && span>=DIR_MIN_SPAN_MS && Math.abs(moved)>=DIR_MIN_MOVE_M) autoDir = Math.sign(moved);
  const dir = dirMode==="auto" ? (autoDir||1) : +dirMode;
  const v = (raw||0)*dir; // 進行方向の速さ

  const distA = loc.t*loc.len, distB=(1-loc.t)*loc.len;
  let atIdx = -1; // 止まる駅のそばにいればその駅（通過駅は除く）
  if(distA<NEAR_M && STOP[loc.i]) atIdx=loc.i; else if(distB<NEAR_M && STOP[loc.i+1]) atIdx=loc.i+1;
  atIdx = atIdx>=0 ? wrap(atIdx) : -1;

  // 前後の止まる駅
  const pi = stopFrom(dir>0 ? loc.i : loc.i+1, -dir), ni = stopFrom(dir>0 ? loc.i+1 : loc.i, dir);
  if(offRoute){
    $("lead").textContent="路線から離れています";
    showLineIdle();
    $("remain").textContent=`最寄りの区間まで約${(loc.d/1000).toFixed(1)}km`;
    $("xfer").replaceChildren();
  } else if(atIdx>=0){
    $("lead").textContent="ただいま";
    setName(ST[atIdx][0],ST[atIdx][1]);
    const nx = stopFrom(atIdx+dir,dir);
    $("remain").innerHTML = nx>=0 ? `次は ${ST[nx][0]}・${fmtAhead(Math.abs(ahead(along,G.cum[nx],dir)),v)}` : "終点の区間です";
    $("xfer").innerHTML = XFER[atIdx].length ? `のりかえ ${xferChips(XFER[atIdx])}` : "";
  } else {
    $("lead").textContent="次は";
    setName(ST[ni][0],ST[ni][1]);
    $("remain").innerHTML = `あと${fmtAhead(Math.max(0,ahead(along,G.cum[ni],dir)),v)}`;
    $("xfer").innerHTML = XFER[ni].length ? `のりかえ ${xferChips(XFER[ni])}` : "";
  }

  // 両端の駅（左が前の駅、右が次の駅。丸印は常に左から右へ進む）
  const segLen = ahead(G.cum[pi],G.cum[ni],dir), key = `${pi}-${ni}`;
  let tt = ahead(G.cum[pi],along,dir)/segLen;
  if(band.key===key && tt<band.t && (band.t-tt)*segLen<BAND_BACK_M) tt = band.t;
  band = {key, t:tt};
  $("endL").innerHTML = `${ST[pi][0]}<small>前の駅</small>`;
  $("endR").innerHTML = `${ST[ni][0]}<small>${atIdx>=0?"":"次の駅"}</small>`;
  $("train").style.left = (Math.max(0,Math.min(1,tt))*100)+"%";
  animateTrain({v,atIdx,offRoute,tt,now,loc,along,ni,dir});
  lastRender = {along, atIdx, v, offRoute, dir, tunnel: theme==="tunnel"};

  // 路線図
  const items = $("route").children;
  for(let k=0;k<ST.length;k++){
    const li = items[k*2];
    li.className = STOP[k] ? "" : "pass";
    const passed = !LOOP && (dir>0 ? k<=loc.i && !(atIdx===k) : k>=loc.i+1 && !(atIdx===k)); // 環状線は「通過済み」を付けない
    if(!offRoute && passed) li.classList.add("past");
    if(!offRoute && sameSt(k,atIdx)) li.classList.add("cur");
    li.querySelector(".tag").textContent = (!offRoute && atIdx<0 && sameSt(k,ni)) ? "次" : "";
  }
  document.querySelectorAll(".route .me").forEach(e=>e.remove());
  if(!offRoute && atIdx<0){
    const gap = items[loc.i*2+1], me=document.createElement("span");
    me.className="me"; gap.appendChild(me);
    // 隣の駅の行間に配置
    const h = items[loc.i*2].offsetHeight;
    me.style.top = (-h/2 + loc.t*h) + "px";
  }
}

function buildRoute(){
  const ol=$("route");
  ST.forEach((s,k)=>{
    const li=document.createElement("li");
    if(!STOP[k]) li.className="pass";
    else { li.dataset.k = k; li.title = "タップでこの駅に合わせる"; li.onclick = ()=>tapStation(k); }
    li.innerHTML = STOP[k] ? `<span>${s[0]}</span><span class="xfs">${xferChips(XFER[k])}</span><span class="tag"></span>`
                           : `<span>${s[0]}</span><span class="pv">通過</span><span class="tag"></span>`;
    ol.appendChild(li);
    if(k<ST.length-1){const g=document.createElement("li");g.className="gap";g.setAttribute("aria-hidden","true");ol.appendChild(g);}
  });
}

// 今の路線から離れていて、別の路線の上にいそうなら切り替えを提案
function suggestLines(lat,lng,acc){
  const box = $("suggest"), curD = locate(lat,lng).d;
  if(acc > SUGGEST_MAX_ACC_M){ autoN = 0; return; }
  if(curD < SUGGEST_IN_M){ box.hidden = true; autoN = 0; return; }
  const near = Object.keys(LINES)
    .filter(id => id!==LINE.id && !dismissed.has(id))
    .map(id => ({id, d: locate(lat,lng,GEOMS[id]).d}))
    .filter(c => c.d < SUGGEST_IN_M)
    .sort((a,b) => a.d-b.d);
  if(!near.length || (box.hidden && curD < SUGGEST_OUT_M)){ if(!near.length) box.hidden = true; autoN = 0; return; }
  // 自動切り替え: 候補が1つだけの状態が続いたら切り替える
  if(autoSwitch && near.length===1 && !noAuto.has(near[0].id)){
    autoN = autoCand===near[0].id ? autoN+1 : 1; autoCand = near[0].id;
    if(autoN >= AUTO_FIXES){ autoSwitchTo(near[0].id); return; }
  } else autoN = 0;
  const key = near.map(c=>c.id).join();
  box.hidden = false;
  if(box.dataset.key === key) return;
  box.dataset.key = key;
  box.replaceChildren();
  const t = document.createElement("div"); t.className = "t";
  t.innerHTML = `<span>この近くを走っている路線</span><button class="x" aria-label="閉じる">×</button>`;
  t.querySelector(".x").onclick = () => { near.forEach(c=>dismissed.add(c.id)); box.hidden = true; box.dataset.key = ""; };
  box.appendChild(t);
  near.forEach(c=>{
    const b = document.createElement("button"), line = LINES[c.id];
    b.className = "go"; b.style.setProperty("--c", line.color.light);
    b.innerHTML = `<i></i>${line.name}に切り替え`;
    b.onclick = () => selectLine(c.id);
    box.appendChild(b);
  });
}

function autoSwitchTo(id){
  const from = LINE.id;
  selectLine(id); // 位置情報の使用中なので、切り替え先での現在地もここで表示される
  const note = $("autoNote");
  note.replaceChildren();
  const t = document.createElement("div"); t.className = "t";
  t.innerHTML = `<span>${LINES[id].name}に自動で切り替えました</span><button class="x" aria-label="閉じる">×</button>`;
  t.querySelector(".x").onclick = () => { note.hidden = true; };
  const b = document.createElement("button");
  b.className = "go"; b.style.setProperty("--c", LINES[from].color.light);
  b.innerHTML = `<i></i>${LINES[from].name}に戻す`;
  b.onclick = () => { selectLine(from); noAuto.add(id); }; // 戻した路線へは再び自動で切り替えない
  note.append(t,b); note.hidden = false;
  clearTimeout(autoNoteTimer); autoNoteTimer = setTimeout(()=>{ note.hidden = true; }, AUTO_NOTE_MS);
}

                ["江戸川",35.8440,139.8890],["荒川",35.6680,139.8400],["旧江戸川",35.6645,139.8800],["多摩川",35.5840,139.6780]];

const CITY_FAR_M = 22000, RIVER_NEAR_M = 600, RIVER_SHOW_M = 220;
const TILE = {clouds:320, far:240, near:220, bridge:120}; // 各層の絵の幅(px)
const SCENE_PX_PER_M = {clouds:0.3, far:1.5, near:6, bridge:6}; // 1m進むごとに流れる量。手前ほど速い
const STOP_SLEEP_MS = 30000, SIGNAL_WAIT_MS = 15000, SAY_GAP_MS = 20000, SAY_SHOW_MS = 2600, FAST_MPS = 80/3.6;
const TAP_LINES = ["がたんごとん♪","えへへ","なでなで？","いっしょにがんばろ！","しゅっしゅっぽっぽ♪","つり革につかまってね","今日もいい天気？","よそみ運転じゃないよ！"];
const GREET = {morning:"おはよう！いってきます", day:"しゅっぱつしんこう！", evening:"おかえりなさい〜", night:"おつかれさま、帰ろうね"};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let sceneV = 0, sceneVAt = 0, sceneOff = {clouds:0, far:0, near:0, bridge:0}, lastFrame = 0;
let theme = "city", riverName = "", sceneKey = "", lineRivers = [], lineTunnels = [];
let prevAt = null, stopSince = null, greeted = false, soonIdx = -1, waitSaid = false, sleepSaid = false, wasSleep = false, wasOff = false, fastSaid = false;
let sayQueue = [], saying = false, lastSaid = {};

function svgTile(w,h,body){
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>${body}</svg>`)}")`;
}

function timeOfDay(h){ return h>=5&&h<9 ? "morning" : h>=9&&h<16 ? "day" : h>=16&&h<19 ? "evening" : "night"; }

function meters(lat1,lng1,lat2,lng2){
  return Math.hypot((lng2-lng1)*111320*Math.cos(lat1*Math.PI/180),(lat2-lat1)*110540);
}

// 窓明かり付きの建物（夕方と夜だけ明かり）
function buildings(list,c,h0){
  let out = "";
  list.forEach(([x,w,h],n)=>{
    out += `<rect x='${x}' y='${h0-h}' width='${w}' height='${h}' fill='${c.far}'/>`;
    if(c.win) for(let wy=h0-h+5; wy<h0-4; wy+=7) for(let wx=x+4; wx<x+w-3; wx+=7)
      if((wx*7+wy*13+n)%5<2) out += `<rect x='${wx}' y='${wy}' width='3' height='3' fill='${c.win}'/>`;
  });
  return out;
}

  let far = "", near = "";

    near = `<g fill='${c.near}'><circle cx='20' cy='30' r='12'/><circle cx='34' cy='34' r='9'/><circle cx='96' cy='32' r='11'/><circle cx='186' cy='29' r='13'/></g>`+pole;
  }else if(theme==="town"){ // 三角屋根の家と低いマンション
    const houses = [[6,22,14],[40,20,12],[98,24,15],[150,20,13],[200,22,14]];

      far += `<rect x='${x}' y='${60-h}' width='${w}' height='${h}' fill='${c.far}'/><path d='M${x-3} ${60-h}L${x+w/2} ${60-h-10}L${x+w+3} ${60-h}Z' fill='${c.roof}'/>`;
      if(c.win) far += `<rect x='${x+w/2-2}' y='${60-h+4}' width='4' height='4' fill='${c.win}'/>`;
    });
    near = `<g fill='${c.near}'><rect x='0' y='34' width='70' height='10' rx='5'/><circle cx='110' cy='31' r='10'/><rect x='160' y='35' width='60' height='9' rx='4'/></g>`+pole;
  }else if(theme==="country"){ // 遠くの山と丘、田んぼ
    far = `<path d='M30 60L110 14L190 60Z' fill='${c.mtn}'/><path d='M95 23L110 14L125 23L118 26L110 22L102 26Z' fill='#FFFFFF' opacity='.85'/>`+
          `<ellipse cx='20' cy='62' rx='60' ry='22' fill='${c.hill}'/><ellipse cx='200' cy='64' rx='70' ry='24' fill='${c.hill}'/>`+
          `<rect x='150' y='44' width='14' height='10' fill='${c.far}'/><path d='M147 44L157 37L167 44Z' fill='${c.roof}'/>`;
    near = `<rect x='0' y='30' width='220' height='14' fill='${c.field}'/><g stroke='${c.near}' stroke-width='1.2' opacity='.6'>`+
           Array.from({length:22},(_,n)=>`<path d='M${n*10+3} 33v8'/>`).join("")+`</g><g fill='${c.near}'><circle cx='60' cy='26' r='9'/></g>`+pole;
  }else if(theme==="river"){ // 低い対岸の街と川面
    far = buildings([[10,22,16],[40,16,20],[70,28,14],[120,20,18],[160,26,15],[200,18,20]],c,60);
    near = `<rect x='0' y='22' width='220' height='22' fill='${c.water}'/><g stroke='#FFFFFF' stroke-width='1.5' fill='none' opacity='.6' stroke-linecap='round'>`+
           `<path d='M14 30q5-3 10 0'/><path d='M80 37q5-3 10 0'/><path d='M150 29q5-3 10 0'/><path d='M196 39q5-3 10 0'/></g>`;

  $("lyFar").style.backgroundImage = svgTile(tunnel ? 160 : 240, 60, far);

    `<g stroke='${c.truss}' stroke-width='3' fill='none' stroke-linejoin='round'><path d='M0 2H120'/><path d='M0 44L30 2L60 44L90 2L120 44'/></g>`);
  TILE.far = tunnel ? 160 : 240;

// 路線ごとに、川を渡る位置と地下区間を線路沿いの位置(m)で求めておく
function prepareScene(line){
  lineRivers = RIVERS.map(([name,lat,lng])=>{ const l = locate(lat,lng); return l.d<RIVER_NEAR_M ? {name, s:G.cum[l.i]+l.t*l.len} : null; }).filter(Boolean);
  const idx = n => line.stations.findIndex(x=>x.name===n);
  lineTunnels = (line.tunnels||[]).map(([a,b])=>[G.cum[idx(a)],G.cum[idx(b)]].sort((x,y)=>x-y)).filter(r=>r.every(x=>x!==undefined));
}

// 今いる場所の景色のパターン
function themeAt(loc,along){
  if(lineTunnels.some(([a,b])=>along>=a && along<=b)) return ["tunnel",""];
  const r = lineRivers.find(x=>Math.abs(ds(x.s,along))<RIVER_SHOW_M);
  if(r) return ["river",r.name];
  const lat = ST[loc.i][2]+(ST[loc.i+1][2]-ST[loc.i][2])*loc.t, lng = ST[loc.i][3]+(ST[loc.i+1][3]-ST[loc.i][3])*loc.t;
  if(CITIES.some(([la,ln,r])=>meters(la,ln,lat,lng)<r)) return ["city",""];
  return [meters(35.681,139.767,lat,lng)>CITY_FAR_M ? "country" : "town", ""];
}

function sceneFrame(t){
  const dt = Math.min(0.1, (t-(lastFrame||t))/1000); lastFrame = t;
  const v = performance.now()-sceneVAt < 10000 ? sceneV : 0; // 10秒更新がなければ止まったとみなす
  sceneOff.clouds -= (3 + v*SCENE_PX_PER_M.clouds)*dt; // 雲は止まっていてもゆっくり流れる
  for(const k of ["far","near","bridge"]) sceneOff[k] -= v*(theme==="tunnel" && k==="far" ? SCENE_PX_PER_M.near : SCENE_PX_PER_M[k])*dt;
  for(const k of ["clouds","far","near","bridge"]){
    sceneOff[k] %= TILE[k];
    $("ly"+k[0].toUpperCase()+k.slice(1)).style.backgroundPositionX = sceneOff[k].toFixed(1)+"px";
  }
  requestAnimationFrame(sceneFrame);
}

// セリフ。重なったら順番に出す。force でなければ同じセリフは20秒あける
function say(text,{hop=false,force=false}={}){
  const now = Date.now();
  if(!force && now-(lastSaid[text]||-Infinity) < SAY_GAP_MS) return;
  lastSaid[text] = now;
  if(force){ sayQueue = []; saying = false; }
  if(sayQueue.length<3) sayQueue.push({text,hop});
  if(!saying) nextSay();
}
function nextSay(){
  const m = sayQueue.shift(), b = $("bubble"), tr = $("train");
  if(!m){ saying = false; b.classList.remove("show"); return; }
  saying = true;
  b.textContent = m.text; b.classList.add("show"); placeBubble();
  if(m.hop && !reduceMotion){ tr.classList.remove("hop"); void tr.offsetWidth; tr.classList.add("hop"); }
  clearTimeout(nextSay.timer); nextSay.timer = setTimeout(nextSay, SAY_SHOW_MS);
}

// 吹き出しを電車の真上に置き、車窓からはみ出すときは内側に寄せる
function placeBubble(){
  const b = $("bubble"), tr = $("train"), sc = $("scene");
  const trBox = tr.getBoundingClientRect(), scBox = sc.getBoundingClientRect(), bw = b.offsetWidth;
  const center = trBox.left + trBox.width/2 - scBox.left;
  const left = Math.max(4, Math.min(scBox.width - bw - 4, center - bw/2));
  b.style.left = (left - (trBox.left - scBox.left)) + "px";
}

function setTrain(state,v){
  const tr = $("train");
  tr.classList.remove("run","stop","sleep");
  tr.classList.add(state);
  if(state==="run") tr.style.setProperty("--spin", Math.max(0.12, 2.5/v).toFixed(2)+"s");
}

// render から呼ぶ: 速さ・場所・駅への到着に合わせてキャラ電車と景色を動かし、セリフを言う
function animateTrain({v,atIdx,offRoute,tt,now,loc,along,ni,dir}){
  sceneV = offRoute ? 0 : Math.max(0,v); sceneVAt = performance.now();
  placeBubble();
  if(offRoute){
    setTrain("sleep"); stopSince = null;
    if(!wasOff) say("どの電車かな？");
    wasOff = true; return;
  }
  wasOff = false;
  if(!greeted){ greeted = true; say(GREET[timeOfDay(new Date().getHours())]); }

  // 景色のパターン
  const [th,rn] = themeAt(loc,along);
  if(th!==theme){
    if(th==="tunnel") say("トンネルだ〜");
    else if(theme==="tunnel") say("まぶしい！");
    if(th==="river") say(`${rn}だ〜！`);
    theme = th; riverName = rn; paintScene();
  }

  // 走る・止まる・眠る
  if(v>=MOVING_MPS){
    if(wasSleep && stopSince!==null) say("あ、うごいた！");
    setTrain("run",v); stopSince = null; waitSaid = false; sleepSaid = false; wasSleep = false;
    if(v>=FAST_MPS && !fastSaid){ fastSaid = true; say("はやーい！"); } // 速い区間に入るたびに1回だけ
    if(v<FAST_MPS*0.75) fastSaid = false;
  }else{
    if(stopSince===null) stopSince = now;
    const sleep = now-stopSince > STOP_SLEEP_MS;
    setTrain(sleep ? "sleep" : "stop"); wasSleep = sleep;
    if(sleep && !sleepSaid){ sleepSaid = true; say("ねむくなってきた…"); }
    if(atIdx<0 && !waitSaid && now-stopSince > SIGNAL_WAIT_MS){ waitSaid = true; say("ちょっとまってね…"); }
  }

  // 駅に近づく・着く・出る
  if(atIdx<0 && ni>=0 && v>=MOVING_MPS && soonIdx!==ni && Math.max(0,ahead(along,G.cum[ni],dir))<400){ soonIdx = ni; say(`まもなく ${ST[ni][0]}！`); }
  if(prevAt===-1 && atIdx>=0){
    const terminal = stopFrom(atIdx+dir,dir)<0;
    say(terminal ? "終点だよ、おつかれさま！" : "とうちゃく！",{hop:true});
    if(!terminal && XFER[atIdx].length) say(`${XFER[atIdx].slice(0,2).map(l=>l.name).join("・")}に乗りかえできるよ`);
  }
  if(prevAt>=0 && atIdx===-1) say("しゅっぱつ！");
  prevAt = atIdx;
}

function resetTrain(){
  prevAt = null; stopSince = null; sceneV = 0; greeted = false; soonIdx = -1;
  waitSaid = sleepSaid = wasSleep = wasOff = fastSaid = false;
  setTrain("sleep");
}

// キャラ電車をタップすると何か言う
$("train").addEventListener("click", ()=>say(TAP_LINES[Math.floor(Math.random()*TAP_LINES.length)],{hop:true,force:true}));

// ---- 位置が取れないときの推定 ----
function estMps(){ return (LINE.estKmh || EST_DEFAULT_KMH)/3.6; }
function curDir(){ return dirMode==="auto" ? (autoDir||1) : +dirMode; }

// 線路沿いの位置 s(m) を locate と同じ形 {i,t,d,len} にする
function locAt(s){
  const N = ST.length, T = G.cum[N-1];
  s = LOOP ? ((s%T)+T)%T : Math.max(0,Math.min(T,s));
  let i = 0; while(i<N-2 && G.cum[i+1]<=s) i++;
  const len = G.cum[i+1]-G.cum[i];
  return {i, t: len ? (s-G.cum[i])/len : 0, d: 0, len};
}

// 位置 s から推定を始め直す（駅のそばならその駅で停車中から）
function estFrom(s,now){
  const dir = curDir(); autoDir = dir;
  const near = ST.map((_,k)=>k).filter(k=>STOP[k]).find(k=>Math.abs(ds(G.cum[k],s))<NEAR_M*1.5);
  if(near!==undefined){ est = {active:true, dir, phase:"dwell", A:wrap(near), t0:now, anchorAt:now}; return; }
  const l = locAt(s), A = stopFrom(dir>0 ? l.i : l.i+1, -dir), B = stopFrom(dir>0 ? l.i+1 : l.i, dir);
  const prog = ahead(G.cum[A], s, dir), L = ahead(G.cum[A], G.cum[B], dir);
  est = {active:true, dir, phase:"run", A, B, L, t0: now - prog/estMps()*1000, anchorAt:now};
}

// 経過時間から推定位置を進めて表示する
function estStep(now){
  const e = est, mps = estMps();
  for(let guard=0; guard<200; guard++){
    if(e.phase==="dwell"){
      if(now-e.t0 < EST_DWELL_MS) break;
      const B = stopFrom(e.A+e.dir, e.dir);
      if(B<0) break; // 終点
      e.phase = "run"; e.B = B; e.L = ahead(G.cum[e.A], G.cum[B], e.dir); e.t0 += EST_DWELL_MS;
    }else{
      const runMs = e.L/mps*1000;
      if(now-e.t0 < runMs) break;
      e.phase = "dwell"; e.A = e.B; e.t0 += runMs;
    }
  }
  const s = e.phase==="dwell" ? G.cum[e.A] : G.cum[e.A] + e.dir*Math.min(e.L, (now-e.t0)/1000*mps);
  e.s = s;
  render(locAt(s), now);
  const min = Math.floor((now-e.anchorAt)/60000);
  setStatus("est","現在地を推定中", min>0 ? `最後の位置から${min}分` : "");
}

// 時刻 t0 に位置 s にいたとして推定を始め、今まで進める
function estStart(s,t0){
  estFrom(s,t0); track = []; band = {key:null,t:0};
  $("sign").classList.add("est");
  estStep(Date.now());
}

function estStop(){
  if(!est.active) return;
  est = {active:false}; track = []; band = {key:null,t:0};
  $("sign").classList.remove("est");
}

// 1秒ごと: 推定を始めるか判断し、推定中なら進める
function estTick(){
  const now = Date.now();
  if(est.active){
    if(now-est.anchorAt > EST_MAX_MS){ // 長く合わせ直せないときは推定をやめ、表示を待機中に戻す
      estStop(); lastGood = null; setStatus(false,"位置が分かりません");
      showLineIdle(); $("lead").textContent = "位置が分かりません"; $("remain").textContent = ""; $("xfer").replaceChildren();
      document.querySelectorAll(".route .me").forEach(e=>e.remove());
      resetTrain(); sceneV = 0;
      return;
    }
    estStep(now); return;
  }
  if(watchId===null || !lastGood || !lastRender || lastRender.offRoute) return;
  if(now-lastGood.t > EST_START_MS && (lastGood.moving || lastGood.tunnel || poorSeen)) estStart(lastGood.s, lastGood.t);
}

// 位置情報を1つ受け取ったとき（精度で扱いを分ける）
function onFix(lat,lng,acc,t){
  if(acc <= GOOD_ACC_M){
    estStop(); poorSeen = false;
    setStatus(true,"現在地を表示中",`精度 ±${Math.round(acc)}m`);
    lastFix = [lat,lng];
    render(locate(lat,lng),t);
    lastGood = {t, s:lastRender.along, moving:lastRender.v>=MOVING_MPS, tunnel:lastRender.tunnel};
    suggestLines(lat,lng,acc);
    return;
  }
  poorSeen = true;
  if(acc > FAIR_ACC_M) return; // 位置としては使わない
  const loc = locate(lat,lng);
  if(loc.d > Math.max(acc, OFF_M)) return;
  const s = G.cum[loc.i] + loc.t*loc.len;
  if(est.active){
    if(Math.abs(ds(est.s ?? s, s)) > Math.max(acc, RESYNC_M)){ estFrom(s,t); track = []; estStep(t); }
    else est.anchorAt = t; // 推定と合っている
  }else if(!lastGood || t-lastGood.t > EST_START_MS) estStart(s,t);
}

// 路線図の駅をタップ: 今その駅にいるとして推定を始める
function tapStation(k){
  if(demoTimer) stopAll();
  if(watchId===null) startTracking();
  if(!estTimer) estTimer = setInterval(estTick, 1000); // 位置情報が使えなくても推定は進める
  const now = Date.now();
  estFrom(G.cum[k],now); est.anchorAt = now; track = []; band = {key:null,t:0};
  $("sign").classList.add("est");
  estStep(now);
  say(`${ST[k][0]}に合わせたよ`,{hop:true,force:true});
  $("msg").textContent = "向きが違うときは方面ボタンで変えてね。正確な位置が取れたら自動でそちらに切り替わります。";
}

function setStatus(live,text,acc){
  $("status").classList.toggle("live",live===true);
  $("status").classList.toggle("est",live==="est");
  $("statusText").textContent=text;
  $("acc").textContent=acc||"";
}

async function keepAwake(){
  try{ if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && (watchId!==null||demoTimer)) keepAwake(); });

function stopAll(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(demoTimer){clearInterval(demoTimer);demoTimer=null;}
  try{wakeLock&&wakeLock.release();}catch(e){}
  wakeLock=null;
  $("startBtn").textContent="位置情報を開始"; $("demoBtn").textContent="デモ走行";
  setStatus(false,"停止中"); resetTrain();
  estStop(); clearInterval(estTimer); estTimer = null; lastGood = null; poorSeen = false;
}

function startTracking(){
  stopAll();
  if(!("geolocation" in navigator)){ $("msg").textContent="この画面では位置情報が使えません。Safariで直接開いてください。"; return; }
  setStatus(false,"位置を取得中…"); track = []; band = {key:null,t:0}; resetTrain();
  keepAwake();
  watchId = navigator.geolocation.watchPosition(p=>{
    onFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.timestamp);
  },err=>{
    if(err.code!==1 && est.active) return; // 推定中なら、地下で取れないのは想定どおり
    const m = err.code===1 ? "位置情報が許可されていません。この画面で許可できない場合は、Safariで直接開いてください。" : "位置を取得できませんでした。電波の良い場所で再度お試しください。";
    $("msg").textContent=m; setStatus(false,"取得できません");
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  estTimer = setInterval(estTick, 1000);
  $("startBtn").textContent="停止";
}

$("startBtn").onclick=()=>{
  if(!LINE) return;
  if(watchId!==null){stopAll();return;}
  startTracking();
};

$("demoBtn").onclick=()=>{
  if(!LINE) return;
  if(demoTimer){stopAll();return;}
  stopAll(); autoDir=0; track=[]; band={key:null,t:0}; resetTrain();
  let s=0, vt=0; const dir = dirMode==="-1"?-1:1, total=(ST.length-1)*1000;
  setStatus(true,"デモ走行中");
  keepAwake();
  demoTimer=setInterval(()=>{
    s+=12; if(s>total){ s=0; track=[]; }
    const f=s/1000, raw = dir>0?f:(ST.length-1)-f;
    const i=Math.min(ST.length-2,Math.floor(raw)), t=raw-i;
    const lat=ST[i][2]+(ST[i+1][2]-ST[i][2])*t, lng=ST[i][3]+(ST[i+1][3]-ST[i][3])*t;
    vt += 0.012*(G.cum[i+1]-G.cum[i])/DEMO_MPS*1000; // 時速60kmで走った場合の経過時間
    render(locate(lat,lng),vt);
  },100);
  $("demoBtn").textContent="デモ停止";
};

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  dirMode=b.dataset.dir;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  if(est.active && est.s!==undefined){ const now = Date.now(), a = est.anchorAt; estFrom(est.s,now); est.anchorAt = a; track = []; band = {key:null,t:0}; estStep(now); }
});

function initLine(line){
  if(demoTimer) stopAll();
  LINE = line; autoDir = 0; band = {key:null,t:0}; prevAt = null;
  ST = line.stations.map(s=>[s.name,s.kana,s.lat,s.lng]);
  STOP = line.stations.map(s=>!s.pass);
  LOOP = !!line.loop;
  G = GEOMS[line.id] || geom(line);
  dismissed.clear(); $("suggest").hidden = true; $("autoNote").hidden = true; track = [];
  // 同じ駅名がある他の路線 = 乗り換えできる路線
  XFER = ST.map((s,k)=>!STOP[k] ? [] : Object.values(LINES).filter(l=>l.id!==line.id && l.stations.some(x=>x.name===s[0] && !x.pass)));
  autoCand = null; autoN = 0; noAuto.clear();
  $("xfer").replaceChildren();
  prepareScene(line); theme = "city"; paintScene();

  const root = document.documentElement.style, c = line.color||{};
  const vars = {"--c-line":c.light, "--c-line-soft":c.lightSoft, "--c-line-dark":c.dark, "--c-line-dark-soft":c.darkSoft, "--c-on-line":c.onLine};
  for(const [k,v] of Object.entries(vars)) v ? root.setProperty(k,v) : root.removeProperty(k);

  document.title = `えきなう｜${line.name}`;
  showLineIdle();
  $("endL").textContent = ST[0][0];
  $("endR").textContent = ST[ST.length-1][0];
  const dl = line.dirLabels || [`${ST[ST.length-1][0]}方面`, `${ST[0][0]}方面`];
  $("dirFwd").textContent = dl[0];
  $("dirBack").textContent = dl[1];
  $("msg").textContent = line.note ? `${line.note}${BASE_MSG}` : BASE_MSG;
  $("route").replaceChildren();
  buildRoute();
  $("lineSel").value = line.id;
  estStop(); lastGood = null;
  if(watchId!==null && lastFix) render(locate(...lastFix));
  else if(watchId===null) $("lead").textContent="位置情報を開始してください";
}

function loadScript(src){
  return new Promise((ok,ng)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = ng;
    document.head.appendChild(s);
  });
}

paintScene(); setInterval(paintScene, 60000);
if(!reduceMotion) requestAnimationFrame(sceneFrame);

(async function loadLines(){
  const ids = (window.EKINOW_LINE_IDS||[]).filter(id=>/^[a-z0-9-]+$/.test(id));
  await Promise.allSettled(ids.map(id=>loadScript(`lines/${id}.js`)));
  const all = window.EKINOW_LINES||{}, ok = ids.filter(id=>all[id]);
  if(!ok.length){ $("lead").textContent="路線データを読み込めませんでした"; return; }
  ok.forEach(id=>{ LINES[id] = all[id]; GEOMS[id] = geom(all[id]); });

  const sel = $("lineSel");
  ok.forEach(id=>sel.add(new Option(LINES[id].name,id)));
  sel.onchange = ()=>selectLine(sel.value);

  try{ autoSwitch = localStorage.getItem(AUTO_KEY)==="1"; }catch(e){}
  $("autoSw").checked = autoSwitch;
  $("autoSw").onchange = e => {
    autoSwitch = e.target.checked; autoN = 0;
    try{ localStorage.setItem(AUTO_KEY, autoSwitch ? "1" : "0"); }catch(e){}
  };

  let saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
  const want = new URLSearchParams(location.search).get("line");
  initLine(LINES[[want,saved].find(id=>id && LINES[id]) || ok[0]]);
})();

function selectLine(id){
  initLine(LINES[id]);
  try{ localStorage.setItem(STORE_KEY,id); }catch(e){}
  history.replaceState(null,"",`?line=${id}`);
}
</script>
